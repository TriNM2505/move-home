<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu — Move_home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<main class="auth-page">
  <div class="card-elevated auth-card">
    <a href="../index.html" class="auth-logo">Move_home</a>
    <p class="auth-tagline">Khôi phục quyền truy cập tài khoản của bạn</p>
    <div class="card-soft-tinted mb-xl">
      <h1 class="section-title">Quên mật khẩu?</h1>
      <p class="text-muted">Nhập email đã đăng ký, hệ thống sẽ gửi đường dẫn đặt lại mật khẩu trong vòng vài phút.</p>
    </div>
    <form>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="text-input" id="email" type="email" value="an.nguyen@example.com" autocomplete="email">
      </div>
      <a href="reset-password.html" class="btn-primary btn-full">Gửi hướng dẫn</a>
    </form>
    <p class="auth-footer-text mt-xl"><a href="login.html" class="link-primary">Quay lại đăng nhập</a></p>
  </div>
</main>
</body>
</html>
