<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu — Move_home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<main class="auth-page">
  <div class="card-elevated auth-card">
    <a href="../index.html" class="auth-logo">Move_home</a>
    <p class="auth-tagline">Khôi phục quyền truy cập tài khoản của bạn</p>

    <div class="card-soft-tinted mb-xl">
      <h1 class="section-title">Quên mật khẩu?</h1>
      <p class="text-muted">Nhập email đã đăng ký. Nếu email tồn tại, hệ thống sẽ gửi đường dẫn đặt lại mật khẩu.</p>
    </div>

    <div id="errorMessage" class="error-alert" hidden role="alert"></div>
    <div id="successMessage" class="alert alert-success mb-lg" hidden role="status"></div>

    <form id="forgotPasswordForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="text-input" id="email" type="email" autocomplete="email" maxlength="255" required>
        <span class="form-error" id="emailError" role="alert" hidden></span>
      </div>
      <button type="submit" class="btn-primary btn-full" id="submitButton">Gửi hướng dẫn</button>
    </form>

    <p class="auth-footer-text mt-xl"><a href="login.html" class="link-primary">Quay lại đăng nhập</a></p>
  </div>
</main>

<script type="module">
  import { forgotPassword } from '../js/auth.js';

  const form = document.getElementById('forgotPasswordForm');
  const emailInput = document.getElementById('email');
  const button = document.getElementById('submitButton');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    clearMessages();

    const email = emailInput.value.trim();
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      show('emailError', 'Vui lòng nhập email hợp lệ.');
      return;
    }

    setLoading(true);
    try {
      const response = await forgotPassword(email);
      show('successMessage', response.message);
      emailInput.value = '';
    } catch (error) {
      show('errorMessage', error.message || 'Không thể gửi yêu cầu. Vui lòng thử lại.');
    } finally {
      setLoading(false);
    }
  });

  function show(id, message) {
    const element = document.getElementById(id);
    element.textContent = message;
    element.removeAttribute('hidden');
  }

  function clearMessages() {
    ['errorMessage', 'successMessage', 'emailError'].forEach((id) => {
      const element = document.getElementById(id);
      element.textContent = '';
      element.setAttribute('hidden', '');
    });
  }

  function setLoading(loading) {
    button.disabled = loading;
    button.classList.toggle('btn-loading', loading);
    button.textContent = loading ? 'Đang gửi...' : 'Gửi hướng dẫn';
  }
</script>
</body>
</html>
