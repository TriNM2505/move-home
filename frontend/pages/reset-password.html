<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu — Move_home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<main class="auth-page">
  <div class="card-elevated auth-card">
    <a href="../index.html" class="auth-logo">Move_home</a>
    <p class="auth-tagline">Tạo mật khẩu mới an toàn cho tài khoản</p>
    <form>
      <div class="form-group">
        <label class="form-label" for="password">Mật khẩu mới</label>
        <input class="text-input" id="password" type="password" value="Movehome@2026" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm">Xác nhận mật khẩu mới</label>
        <input class="text-input" id="confirm" type="password" value="Movehome@2026" autocomplete="new-password">
      </div>
      <div class="form-success mb-lg">Mật khẩu phải có ít nhất 8 ký tự, gồm chữ và số.</div>
      <a href="login.html" class="btn-primary btn-full">Đặt lại mật khẩu</a>
    </form>
    <p class="auth-footer-text mt-xl"><a href="forgot-password.html" class="link-primary">Gửi lại đường dẫn</a></p>
  </div>
</main>
</body>
</html>
