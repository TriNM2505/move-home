<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu — Move_home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
<main class="auth-page auth-page--split">
  <!-- Cột Banner Trái (Thương hiệu & Minh họa) -->
  <div class="auth-banner">
    <div class="auth-banner-content">
      <h1 class="auth-banner-title">Giải pháp chuyển nhà chuyên nghiệp và tin cậy</h1>
      <p class="auth-banner-text">Đội ngũ vận chuyển tận tâm, quy trình nhanh gọn, bảo hiểm an tâm. MoveHome đồng hành cùng bạn tới tổ ấm mới.</p>
      <img src="../assets/moving_illustration.png" alt="Minh họa chuyển nhà" class="auth-banner-illustration" />
    </div>
  </div>

  <!-- Cột Form Phải (Đặt lại mật khẩu) -->
  <div class="auth-form-container">
    <div class="card-elevated auth-card">
      <a href="../index.html" class="auth-logo">Move_home</a>
      <p class="auth-tagline">Tạo mật khẩu mới an toàn cho tài khoản</p>

      <div id="errorMessage" class="error-alert mb-lg" hidden role="alert"></div>
      <div id="successMessage" class="alert alert-success mb-lg" hidden role="status"></div>

      <form id="resetPasswordForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="password">Mật khẩu mới</label>
          <div class="input-wrapper">
            <input class="text-input" id="password" type="password" placeholder="Nhập mật khẩu mới" autocomplete="new-password" minlength="8" maxlength="72" required>
            <button type="button" class="input-toggle-btn" id="password-toggle" aria-label="Hiện hoặc ẩn mật khẩu">👁</button>
          </div>
          <span class="form-error" id="passwordError" role="alert" hidden></span>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm">Xác nhận mật khẩu mới</label>
          <div class="input-wrapper">
            <input class="text-input" id="confirm" type="password" placeholder="Xác nhận mật khẩu mới" autocomplete="new-password" minlength="8" maxlength="72" required>
            <button type="button" class="input-toggle-btn" id="confirm-toggle" aria-label="Hiện hoặc ẩn mật khẩu">👁</button>
          </div>
          <span class="form-error" id="confirmError" role="alert" hidden></span>
        </div>
        <div class="form-success mb-lg">Mật khẩu từ 8–72 ký tự, gồm chữ hoa, chữ thường, số và ký tự đặc biệt.</div>
        <button type="submit" class="btn-primary btn-full" id="submitButton">Đặt lại mật khẩu</button>
      </form>

      <p class="auth-footer-text mt-xl"><a href="forgot-password.html" class="link-primary">Gửi lại đường dẫn</a></p>
    </div>
  </div>
</main>

<script type="module">
  import { resetPassword } from '../js/auth.js';

  const token = new URLSearchParams(window.location.search).get('token');
  const form = document.getElementById('resetPasswordForm');
  const button = document.getElementById('submitButton');

  if (!token) {
    show('errorMessage', 'Đường dẫn đặt lại mật khẩu không hợp lệ. Vui lòng yêu cầu đường dẫn mới.');
    button.disabled = true;
  }

  // Toggle visibility of new password
  document.getElementById('password-toggle').addEventListener('click', function () {
    const input = document.getElementById('password');
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    this.textContent = isHidden ? '🙈' : '👁';
    this.setAttribute('aria-label', isHidden ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
  });

  // Toggle visibility of confirm password
  document.getElementById('confirm-toggle').addEventListener('click', function () {
    const input = document.getElementById('confirm');
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    this.textContent = isHidden ? '🙈' : '👁';
    this.setAttribute('aria-label', isHidden ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
  });

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    clearMessages();

    const password = document.getElementById('password').value;
    const confirmation = document.getElementById('confirm').value;
    const passwordPattern = /^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@$!%*?&_.#^()\-])[A-Za-z\d@$!%*?&_.#^()\-]{8,72}$/;

    if (!passwordPattern.test(password)) {
      show('passwordError', 'Mật khẩu chưa đáp ứng yêu cầu bảo mật.');
      return;
    }
    if (password !== confirmation) {
      show('confirmError', 'Mật khẩu xác nhận không khớp.');
      return;
    }
    if (!token) return;

    setLoading(true);
    try {
      const response = await resetPassword(token, password);
      show('successMessage', response.message);
      form.reset();
      setTimeout(() => { window.location.href = 'login.html'; }, 2000);
    } catch (error) {
      const message = [409, 410].includes(error.status)
        ? 'Đường dẫn đã hết hạn hoặc đã được sử dụng. Vui lòng yêu cầu đường dẫn mới.'
        : (error.message || 'Không thể đặt lại mật khẩu. Vui lòng thử lại.');
      show('errorMessage', message);
    } finally {
      setLoading(false);
    }
  });

  function show(id, message) {
    const element = document.getElementById(id);
    element.textContent = message;
    element.removeAttribute('hidden');
  }

  function clearMessages() {
    ['errorMessage', 'successMessage', 'passwordError', 'confirmError'].forEach((id) => {
      const element = document.getElementById(id);
      element.textContent = '';
      element.setAttribute('hidden', '');
    });
  }

  function setLoading(loading) {
    button.disabled = loading;
    button.classList.toggle('btn-loading', loading);
    if (loading) {
      button.innerHTML = '<span class="btn-spinner"></span> Đang cập nhật...';
    } else {
      button.textContent = 'Đặt lại mật khẩu';
    }
  }
</script>
</body>
</html>
