<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký — Move_home</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">

  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<main class="auth-page">
  <div class="auth-card card-elevated">

    <!-- Logo -->
    <a href="../index.html" class="auth-logo">Move_home</a>

    <!-- Tiêu đề -->
    <h2 style="text-align:center; margin:0 0 4px; font-size:20px; font-weight:700; color:var(--color-ink);">
      Tạo tài khoản mới
    </h2>
    <p class="auth-tagline">Đặt dịch vụ chuyển nhà chỉ trong vài bước</p>

    <!-- Thông báo lỗi -->
    <div id="errorMessage" class="error-alert" hidden role="alert"></div>

    <!-- Thông báo thành công -->
    <div id="successMessage" class="alert alert-success" hidden role="status"></div>

    <!-- Form đăng ký -->
    <form id="registerForm" novalidate>

      <!-- Họ và tên -->
      <div class="form-group">
        <label for="fullName" class="form-label">Họ và tên <span class="form-required" aria-hidden="true">*</span></label>
        <input id="fullName" name="fullName" type="text" class="text-input"
               placeholder="Nhập họ và tên" required autofocus>
        <span class="form-error" id="fullName-error" role="alert" hidden></span>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email" class="form-label">Email <span class="form-required" aria-hidden="true">*</span></label>
        <input id="email" name="email" type="email" class="text-input"
               placeholder="Nhập email của bạn" required autocomplete="email">
        <span class="form-error" id="email-error" role="alert" hidden></span>
      </div>

      <!-- Số điện thoại -->
      <div class="form-group">
        <label for="phone" class="form-label">Số điện thoại</label>
        <input id="phone" name="phone" type="tel" class="text-input"
               placeholder="+84xxxxxxxxx" autocomplete="tel">
        <span class="form-error" id="phone-error" role="alert" hidden></span>
      </div>

      <!-- Mật khẩu -->
      <div class="form-group">
        <label for="password" class="form-label">Mật khẩu <span class="form-required" aria-hidden="true">*</span></label>
        <div class="input-wrapper">
          <input id="password" name="password" type="password" class="text-input"
                 placeholder="Tối thiểu 8 ký tự" required minlength="8" autocomplete="new-password">
          <button type="button" class="input-toggle-btn" id="pwd-toggle" aria-label="Hiện hoặc ẩn mật khẩu">👁</button>
        </div>
        <span class="form-error" id="password-error" role="alert" hidden></span>
      </div>

      <!-- Xác nhận mật khẩu -->
      <div class="form-group">
        <label for="passwordConfirm" class="form-label">Xác nhận mật khẩu <span class="form-required" aria-hidden="true">*</span></label>
        <div class="input-wrapper">
          <input id="passwordConfirm" name="passwordConfirm" type="password" class="text-input"
                 placeholder="Nhập lại mật khẩu" required autocomplete="new-password">
          <button type="button" class="input-toggle-btn" id="pwd-confirm-toggle" aria-label="Hiện hoặc ẩn mật khẩu xác nhận">👁</button>
        </div>
        <span class="form-error" id="passwordConfirm-error" role="alert" hidden></span>
      </div>

      <!-- Điều khoản -->
      <div class="form-group">
        <label class="form-check">
          <input type="checkbox" class="form-check-input" id="termsAccepted" name="termsAccepted" required>
          <span class="form-check-box" aria-hidden="true"></span>
          <span class="form-check-label">
            Tôi đồng ý với
            <a href="#" class="link-primary">điều khoản sử dụng</a>
            và
            <a href="#" class="link-primary">chính sách bảo mật</a>
          </span>
        </label>
        <span class="form-error" id="terms-error" role="alert" hidden></span>
      </div>

      <!-- Nút đăng ký -->
      <div class="form-group">
        <button id="registerBtn" type="submit" class="btn-primary btn-full">
          Đăng ký
        </button>
      </div>

    </form>

    <div class="auth-divider">hoặc</div>

    <p class="auth-footer-text">
      Đã có tài khoản?
      <a href="login.html" class="link-primary">Đăng nhập</a>
    </p>

  </div>
</main>

<!-- auth.js và api.js là ES modules — load qua type="module" import -->
<script type="module">
  import { register } from '../js/auth.js';

  // Hiện/ẩn mật khẩu
  function setupToggle(btnId, inputId) {
    document.getElementById(btnId)?.addEventListener('click', function () {
      const el = document.getElementById(inputId);
      const hidden = el.type === 'password';
      el.type = hidden ? 'text' : 'password';
      this.textContent = hidden ? '🙈' : '👁';
      this.setAttribute('aria-label', hidden ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
    });
  }
  setupToggle('pwd-toggle', 'password');
  setupToggle('pwd-confirm-toggle', 'passwordConfirm');

  // Validate phía client
  function validate(data) {
    const errors = {};
    if (!data.fullName || data.fullName.trim().length < 2) {
      errors.fullName = 'Họ và tên phải có ít nhất 2 ký tự.';
    }
    if (!data.email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) {
      errors.email = 'Email không hợp lệ.';
    }
    if (data.phone && !/^(\+84|0)[0-9]{9,10}$/.test(data.phone.replace(/\s/g, ''))) {
      errors.phone = 'Số điện thoại không đúng định dạng (vd: +84901234567).';
    }
    if (!data.password || data.password.length < 8) {
      errors.password = 'Mật khẩu phải có ít nhất 8 ký tự.';
    } else if (!/^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@$!%*?&_.#^()\-]).{8,}$/.test(data.password)) {
      errors.password = 'Mật khẩu phải chứa chữ hoa, số và ký tự đặc biệt.';
    }
    if (data.password !== data.passwordConfirm) {
      errors.passwordConfirm = 'Mật khẩu xác nhận không khớp.';
    }
    if (!data.termsAccepted) {
      errors.terms = 'Vui lòng đồng ý với điều khoản sử dụng.';
    }
    return errors;
  }

  // Submit đăng ký
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErrors();

    const data = {
      fullName:        document.getElementById('fullName').value.trim(),
      email:           document.getElementById('email').value.trim().toLowerCase(),
      phone:           document.getElementById('phone').value.trim() || null,
      password:        document.getElementById('password').value,
      passwordConfirm: document.getElementById('passwordConfirm').value,
      termsAccepted:   document.getElementById('termsAccepted').checked,
    };

    const errors = validate(data);
    if (Object.keys(errors).length) {
      const map = {
        fullName: 'fullName-error', email: 'email-error', phone: 'phone-error',
        password: 'password-error', passwordConfirm: 'passwordConfirm-error', terms: 'terms-error',
      };
      Object.entries(errors).forEach(([k, msg]) => showFieldError(map[k], msg));
      return;
    }

    const btn = document.getElementById('registerBtn');
    setLoading(btn, true);

    try {
      const payload = { fullName: data.fullName, email: data.email, password: data.password, termsAccepted: true };
      if (data.phone) payload.phone = data.phone;
      await register(payload);
      showSuccess('🎉 Đăng ký thành công! Vui lòng kiểm tra email để xác thực tài khoản. Đang chuyển về trang đăng nhập...');
      setTimeout(() => { window.location.href = 'login.html'; }, 3000);
    } catch (err) {
      handleError(err);
    } finally {
      setLoading(btn, false);
    }
  });

  function handleError(err) {
    if (err.isNetworkError) {
      showError('Lỗi kết nối. Vui lòng kiểm tra mạng và thử lại.');
      return;
    }
    if (err.status === 409) {
      const field = err.data?.field;
      if (field === 'email')      showFieldError('email-error', 'Email này đã được sử dụng. Vui lòng dùng email khác.');
      else if (field === 'phone') showFieldError('phone-error', 'Số điện thoại này đã được sử dụng.');
      else                        showError('Thông tin đã tồn tại. Vui lòng kiểm tra lại.');
      return;
    }
    if (err.status === 422 && err.data?.details) {
      const map = { fullName: 'fullName-error', email: 'email-error', phone: 'phone-error', password: 'password-error', termsAccepted: 'terms-error' };
      err.data.details.forEach(d => { if (map[d.field]) showFieldError(map[d.field], d.message); });
      return;
    }
    showError(err.message || 'Đăng ký thất bại. Vui lòng thử lại.');
  }

  function showError(msg) {
    const el = document.getElementById('errorMessage');
    el.textContent = msg;
    el.removeAttribute('hidden');
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function showSuccess(msg) {
    const el = document.getElementById('successMessage');
    el.textContent = msg;
    el.removeAttribute('hidden');
    el.style.display = 'flex';
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function showFieldError(id, msg) {
    const el = document.getElementById(id);
    if (el) { el.textContent = msg; el.removeAttribute('hidden'); }
  }

  function clearErrors() {
    ['errorMessage', 'successMessage',
     'fullName-error', 'email-error', 'phone-error',
     'password-error', 'passwordConfirm-error', 'terms-error'
    ].forEach(id => {
      const el = document.getElementById(id);
      if (el) { el.setAttribute('hidden', ''); el.textContent = ''; }
    });
  }

  function setLoading(btn, loading) {
    btn.disabled = loading;
    btn.classList.toggle('btn-loading', loading);
    btn.innerHTML = loading
      ? `<span class="btn-spinner"></span> Đang tạo tài khoản...`
      : 'Đăng ký';
  }
</script>

</body>
</html>
