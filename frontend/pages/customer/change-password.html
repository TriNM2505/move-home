<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đổi mật khẩu — Move_home</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">

  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .password-layout { min-height: 100vh; background: var(--color-canvas-soft); }
    .password-main { max-width: 560px; margin: 0 auto; padding: var(--spacing-4xl) var(--spacing-lg); }
    .security-note { border-left: 4px solid var(--color-accent); background: #FFFBEB; border-radius: var(--rounded-md); padding: var(--spacing-lg); color: var(--color-body); }
  </style>
</head>
<body>
<div class="password-layout">
  <header class="site-header">
    <div class="container site-header-inner">
      <a href="../../index.html" class="site-logo"><span class="site-logo-text">Move_home</span></a>
      <div class="site-header-actions">
        <span class="user-menu-name">Xin chào, Nguyễn Văn An</span>
        <div class="avatar avatar-sm avatar-initials">NA</div>
        <a href="../login.html" class="btn-subtle">Đăng xuất</a>
      </div>
    </div>
  </header>

  <main class="password-main">
    <section class="card-elevated">
      <header class="page-header">
        <h1 class="page-title">Đổi mật khẩu</h1>
        <p class="page-subtitle">Nhập mật khẩu hiện tại và mật khẩu mới để bảo vệ tài khoản.</p>
      </header>

      <p class="security-note mb-8">Sau khi đổi mật khẩu thành công, bạn sẽ đăng nhập lại để tiếp tục sử dụng Move_home.</p>

      <form>
        <div class="form-group">
          <label class="form-label" for="oldPassword">Mật khẩu cũ</label>
          <input class="text-input" type="password" id="oldPassword" name="oldPassword" value="matkhaucu123" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="newPassword">Mật khẩu mới</label>
          <input class="text-input" type="password" id="newPassword" name="newPassword" value="matkhaumoi123" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirmPassword">Xác nhận mật khẩu mới</label>
          <input class="text-input" type="password" id="confirmPassword" name="confirmPassword" value="matkhaumoi123" required>
        </div>

        <div class="flex-between mt-8">
          <a href="home.html" class="btn-secondary">Hủy</a>
          <a href="../login.html" class="btn-primary">Lưu mật khẩu</a>
        </div>
      </form>
    </section>
  </main>
</div>
<!-- JS Common + Bell Dropdown -->
<script type="module" src="../../js/customer-common.js"></script>
</body>
</html>
