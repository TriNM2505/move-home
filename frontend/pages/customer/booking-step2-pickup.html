<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Điểm đón — Move_home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .customer-nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.customer-nav a{color:var(--color-ink);font-weight:500;text-decoration:none}.customer-nav a.active{color:var(--color-primary)}
    .booking-shell{display:grid;grid-template-columns:280px 1fr;gap:24px}.booking-steps{display:grid;gap:10px}.booking-step{padding:12px 14px;border-radius:999px;background:var(--color-canvas-soft);font-weight:500;color:var(--color-body)}.booking-step.active{background:var(--color-primary);color:var(--color-on-primary)}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field-span{grid-column:1/-1}.choice-row{display:flex;gap:12px;flex-wrap:wrap}.choice-pill{padding:10px 16px;border-radius:999px;background:var(--color-canvas-soft);font-weight:500}
    @media (max-width:800px){.booking-shell,.form-grid{grid-template-columns:1fr}.site-header-actions{display:none}}
  </style>
</head>
<body>
<div class="site-layout">
  <header class="site-header"><div class="container site-header-inner"><a href="../../index.html" class="site-logo"><span class="site-logo-text">Move_home</span></a><nav class="customer-nav"><a href="home.html">Trang chủ</a><a href="booking-step1-vehicle.html" class="active">Đặt đơn</a><a href="my-orders-pending.html">Đơn hàng</a><a href="my-profile.html">Tài khoản</a></nav><div class="site-header-actions"><span class="user-menu-name">Xin chào, Nguyễn Văn An</span><div class="avatar avatar-sm avatar-initials">AN</div></div></div></header>
  <main class="site-main"><div class="dashboard-main">
    <header class="page-header"><h1 class="page-title">Nhập điểm đón</h1><p class="page-subtitle">Bước 2/6 — Cho tài xế biết nơi cần lấy đồ.</p></header>
    <div class="booking-shell">
      <aside class="card-content"><div class="booking-steps"><div class="booking-step">1. Chọn xe</div><div class="booking-step active">2. Điểm đón</div><div class="booking-step">3. Điểm trả</div><div class="booking-step">4. Chi tiết</div><div class="booking-step">5. Báo giá</div><div class="booking-step">6. Thanh toán</div></div></aside>
      <section class="card-elevated">
        <div class="form-grid">
          <div class="form-group"><label class="form-label" for="district">Quận điểm đón</label><select class="text-input" id="district"><option>Quận Ba Đình</option><option>Quận Hoàn Kiếm</option><option>Quận Hai Bà Trưng</option><option>Quận Đống Đa</option><option>Quận Tây Hồ</option><option>Quận Cầu Giấy</option><option>Quận Thanh Xuân</option><option>Quận Long Biên</option><option>Quận Hà Đông</option><option>Quận Hoàng Mai</option><option>Quận Bắc Từ Liêm</option><option>Quận Nam Từ Liêm</option></select></div>
          <div class="form-group"><label class="form-label" for="floor">Số tầng</label><input class="text-input" id="floor" value="3"></div>
          <div class="form-group field-span"><label class="form-label" for="address">Địa chỉ chi tiết</label><input class="text-input" id="address" value="Số 25 ngõ 68 phố Đội Cấn, phường Đội Cấn"></div>
          <div class="form-group"><label class="form-label">Thang máy</label><div class="choice-row"><span class="choice-pill">Có thang máy</span><span class="choice-pill">Không có thang máy</span></div></div>
          <div class="form-group"><label class="form-label">Lối vào</label><div class="choice-row"><span class="choice-pill">Có ngõ nhỏ</span><span class="choice-pill">Xe vào tận cửa</span></div></div>
        </div>
        <div class="mt-md"><a href="booking-step1-vehicle.html" class="btn-secondary">Quay lại</a> <a href="booking-step3-dropoff.html" class="btn-primary">Tiếp tục</a></div>
      </section>
    </div>
  </div></main>
</div>
</body>
</html>
