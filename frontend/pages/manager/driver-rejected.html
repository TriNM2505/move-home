<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch sử từ chối tài xế — Move_home</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">

  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>

<div class="site-layout">
  <header class="site-header">
    <div class="container site-header-inner">
      <a href="../../index.html" class="site-logo">
        <span class="site-logo-text">Move_home</span>
        <span class="user-menu-name" style="color:var(--color-mute); font-weight:400; margin-left:8px;">Quản lý</span>
      </a>

      <div class="site-header-actions">
        <span class="user-menu-name">Xin chào, <span id="mgr-name">Quản lý</span></span>
        <div class="avatar avatar-sm avatar-initials">QL</div>
        <button id="logout-btn" class="btn-subtle">Đăng xuất</button>
      </div>
    </div>
  </header>

  <div class="site-body">
    <aside class="sidebar" aria-label="Menu quản lý">
      <nav class="sidebar-nav">
        <a href="home.html" class="sidebar-item">
          <span class="sidebar-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </span>
          <span>Tổng quan</span>
        </a>
        <a href="driver-approvals.html" class="sidebar-item sidebar-item--active">
          <span class="sidebar-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
          </span>
          <span>Duyệt tài xế</span>
        </a>
        <a href="driver-ratings.html" class="sidebar-item">
          <span class="sidebar-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
          </span>
          <span>Đánh giá tài xế</span>
        </a>
        <a href="disputes.html" class="sidebar-item">
          <span class="sidebar-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
          </span>
          <span>Khiếu nại</span>
        </a>
      </nav>
    </aside>

    <main class="site-main" id="main-content">
      <div class="dashboard-main">
        <header class="page-header">
          <h1 class="page-title">Lịch sử từ chối tài xế</h1>
          <p class="page-subtitle">Theo dõi các hồ sơ tài xế không đạt yêu cầu và lý do xử lý.</p>
        </header>

        <section class="card" aria-label="Bảng lịch sử từ chối tài xế">
          <div class="card-header">
            <h2 class="card-title">Hồ sơ đã xử lý</h2>
            <span class="card-meta" id="total-meta">—</span>
          </div>
          <div style="padding:0 16px 8px;">
            <a href="driver-approvals.html" class="link-primary">← Quay lại danh sách chờ duyệt</a>
          </div>
          <div class="table-wrapper" style="border:none; border-radius:0; box-shadow:none;">
            <table class="table table-hover">
              <thead>
                <tr>
                  <th>Họ tên</th>
                  <th>Email</th>
                  <th>SĐT</th>
                  <th>Ngày từ chối</th>
                  <th>Lý do</th>
                  <th>Trạng thái</th>
                </tr>
              </thead>
              <tbody id="rejected-tbody">
                <tr><td colspan="6" style="text-align:center;padding:24px;">Đang tải...</td></tr>
              </tbody>
            </table>
          </div>
          <div style="display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:12px 16px;">
            <span class="text-muted" id="page-info" style="font-size:var(--font-size-body-sm);">—</span>
            <button id="prev-btn" class="btn-secondary btn-sm" disabled>‹ Trước</button>
            <button id="next-btn" class="btn-secondary btn-sm" disabled>Sau ›</button>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>

<script type="module">
  import { isLoggedIn, getCurrentUser, logout } from '../../js/auth.js';
  import { getAuthenticated } from '../../js/api.js';

  const PAGE_SIZE = 10;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtDate = (iso) => !iso ? '—' : new Date(iso).toLocaleString('vi-VN', {
    hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit', year:'numeric', timeZone:'Asia/Ho_Chi_Minh' });

  let currentPage = 0;

  document.addEventListener('DOMContentLoaded', () => {
    if (!isLoggedIn()) { window.location.href = '../login.html'; return; }
    const u = getCurrentUser();
    if (u?.role !== 'MANAGER') { logout('../login.html'); return; }
    if (u.fullName) { const n = $('mgr-name'); if (n) n.textContent = u.fullName; }
    $('logout-btn')?.addEventListener('click', () => logout('../login.html'));
    $('prev-btn').addEventListener('click', () => { if (currentPage > 0) { currentPage--; load(); } });
    $('next-btn').addEventListener('click', () => { currentPage++; load(); });
    load();
  });

  async function load() {
    const tbody = $('rejected-tbody');
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:24px;">Đang tải...</td></tr>`;
    try {
      const data = await getAuthenticated(`/api/manager/drivers/rejected?page=${currentPage}&size=${PAGE_SIZE}`);
      const items = (data && data.content) || [];
      const total = data?.totalElements ?? items.length;
      const totalPages = data?.totalPages ?? 1;
      $('total-meta').textContent = `Tổng ${total} hồ sơ bị từ chối`;

      if (!items.length) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--color-mute)">Không có hồ sơ bị từ chối nào để hiển thị.</td></tr>`;
        $('page-info').textContent = '—';
        $('prev-btn').disabled = true;
        $('next-btn').disabled = true;
        return;
      }

      tbody.innerHTML = items.map(d => `
        <tr>
          <td><a href="driver-detail.html?id=${encodeURIComponent(d.driver_id)}" class="link-primary"><strong>${esc(d.full_name)}</strong></a></td>
          <td>${esc(d.email)}</td>
          <td>${esc(d.phone || '—')}</td>
          <td>${fmtDate(d.updated_at)}</td>
          <td style="max-width:320px;white-space:pre-wrap;word-break:break-word;">${esc(d.rejection_reason || '—')}</td>
          <td><span class="badge badge-sm badge-rejected">Bị từ chối</span></td>
        </tr>`).join('');

      const from = currentPage * PAGE_SIZE + 1;
      const to = Math.min((currentPage + 1) * PAGE_SIZE, total);
      $('page-info').textContent = `Hiển thị ${from}–${to} trong ${total} hồ sơ`;
      $('prev-btn').disabled = currentPage <= 0;
      $('next-btn').disabled = currentPage >= totalPages - 1;
    } catch (err) {
      console.error(err);
      tbody.innerHTML = `
        <tr><td colspan="6" style="text-align:center;padding:24px;color:var(--color-danger)">
          Không thể tải dữ liệu. <button id="retry-btn" class="btn-secondary btn-sm" style="margin-left:8px;">Thử lại</button>
        </td></tr>`;
      document.getElementById('retry-btn')?.addEventListener('click', load);
    }
  }
</script>

<!-- JS Common + Bell Dropdown -->
<script type="module" src="../../js/notifications-bell.js"></script>
</body>
</html>
