<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký Tài xế Bước 1 — Move_home</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">

  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .driver-nav { display: flex; align-items: center; gap: var(--spacing-lg); flex-wrap: wrap; }
    .step-shell { min-height: 100vh; background: var(--color-canvas-soft); padding: var(--spacing-3xl) var(--spacing-lg); }
    .step-card { max-width: 760px; margin: 0 auto; }
    .step-progress { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--spacing-sm); margin: var(--spacing-2xl) 0; }
    .step-progress span { height: 8px; border-radius: var(--rounded-pill); background: var(--color-surface-pressed); }
    .step-progress span:first-child { background: var(--color-primary); }
    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--spacing-xl); }
    .form-grid .full { grid-column: 1 / -1; }
    @media (max-width: 900px) { .driver-nav { order: 3; width: 100%; justify-content: center; } }
    @media (max-width: 700px) { .form-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<header class="site-header">
  <div class="container site-header-inner">
    <a href="../../index.html" class="site-logo"><span class="site-logo-text">Move_home</span></a>
    <nav class="driver-nav" aria-label="Điều hướng tài xế">
      <a href="register-step1.html" class="nav-link active">Đăng ký</a>
      <a href="home.html" class="nav-link">Trang chủ</a>
      <a href="available-orders.html" class="nav-link">Đơn có sẵn</a>
      <a href="in-progress.html" class="nav-link">Đang giao</a>
      <a href="history.html" class="nav-link">Lịch sử</a>
      <a href="profile.html" class="nav-link">Hồ sơ</a>
      <a href="earnings.html" class="nav-link">Thu nhập</a>
    </nav>
    <div class="site-header-actions">
      <a href="../login.html" class="btn-subtle">Đăng nhập</a>
    </div>
  </div>
</header>
<main class="step-shell">
  <section class="card-elevated step-card">
    <a href="../../index.html" class="auth-logo">Move_home</a>
    <p class="auth-tagline">Trở thành tài xế đồng hành cùng khách hàng chuyển nhà an toàn</p>

    <div class="step-progress" aria-label="Tiến độ đăng ký">
      <span></span><span></span><span></span>
    </div>

    <header class="page-header">
      <p class="text-muted">Bước 1/3</p>
      <h1 class="page-title">Thông tin cá nhân</h1>
      <p class="page-subtitle">Nhập thông tin cơ bản để tạo tài khoản tài xế.</p>
    </header>

    <form>
      <div class="form-grid">
        <div class="form-group full">
          <label class="form-label" for="fullName">Họ và tên</label>
          <input class="text-input" id="fullName" name="fullName" value="Lê Văn Cường" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="text-input" type="email" id="email" name="email" value="cuong.taixe@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="phone">Số điện thoại</label>
          <input class="text-input" id="phone" name="phone" value="0912 345 678" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Mật khẩu</label>
          <input class="text-input" type="password" id="password" name="password" value="movehome123" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="birthDate">Ngày sinh</label>
          <input class="text-input" type="date" id="birthDate" name="birthDate" value="1992-08-16" required>
        </div>
        <div class="form-group full">
          <label class="form-label" for="gender">Giới tính</label>
          <select class="text-input" id="gender" name="gender" required>
            <option>Nam</option>
            <option>Nữ</option>
            <option>Không muốn nêu</option>
          </select>
        </div>
      </div>

      <div class="flex-between mt-8">
        <a href="../login.html" class="btn-secondary">Quay lại</a>
        <a href="register-step2.html" class="btn-primary">Tiếp tục</a>
      </div>
    </form>
  </section>
</main>
</body>
</html>
