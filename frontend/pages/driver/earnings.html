<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thu nhập — Move_home</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">

  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    /* Navbar dàn trải và chia đều khoảng cách */
    .driver-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 1;
      gap: var(--spacing-md);
      flex-wrap: nowrap;
      margin: 0 var(--spacing-xl);
    }

    /* Bỏ gạch chân cho link và active link */
    .driver-nav a.nav-link {
      border-bottom: none !important;
      text-decoration: none !important;
      white-space: nowrap;
    }
    .driver-nav a.nav-link.active {
      border-bottom: none !important;
      color: var(--color-primary) !important;
      font-weight: 600;
    }
    .driver-nav a.nav-link:hover {
      text-decoration: none !important;
      color: var(--color-primary) !important;
    }

    /* Hỗ trợ responsive để tránh bị dồn ép trên màn hình trung bình/nhỏ */
    @media (max-width: 1024px) {
      .site-header {
        height: auto;
        min-height: 64px;
        padding: var(--spacing-sm) 0;
      }
      .site-header-inner {
        height: auto;
        flex-wrap: wrap;
        gap: var(--spacing-md);
      }
      .driver-nav {
        order: 3;
        width: 100%;
        flex: none;
        justify-content: center;
        gap: var(--spacing-md);
        flex-wrap: wrap;
        margin: var(--spacing-sm) 0 0 0;
      }
    }

    /* Căn giữa toàn bộ vùng nội dung chính */
    .dashboard-main {
      margin: 0 auto;
    }

    .state-cell { text-align: center; padding: 40px 16px; color: var(--color-body); }
  </style>
</head>
<body>
<div class="site-layout">
  <header class="site-header">
    <div class="container site-header-inner">
      <a href="../../index.html" class="site-logo"><span class="site-logo-text">Move_home</span></a>
      <nav class="driver-nav" aria-label="Điều hướng tài xế">
        <a href="home.html" class="nav-link">Trang chủ</a>
        <a href="available-orders.html" class="nav-link">Đơn có sẵn</a>
        <a href="in-progress.html" class="nav-link">Đang giao</a>
        <a href="history.html" class="nav-link">Lịch sử</a>
        <a href="profile.html" class="nav-link">Hồ sơ</a>
        <a href="earnings.html" class="nav-link active">Thu nhập</a>
        <a href="withdrawal-request.html" class="nav-link">Rút tiền</a>
      </nav>
      <div class="site-header-actions">
        <span class="user-menu-name">Xin chào, <span id="header-user-name">Tài xế</span></span>
        <div class="avatar avatar-sm avatar-initials" id="header-user-avatar">TX</div>
        <button id="logout-btn" class="btn-subtle">Đăng xuất</button>
      </div>
    </div>
  </header>

  <main class="site-main">
    <div class="dashboard-main">
      <header class="page-header flex-between">
        <div>
          <h1 class="page-title">Thu nhập</h1>
          <p class="page-subtitle">Tổng hợp thu nhập và các giao dịch nhận tiền của bạn.</p>
        </div>
        <a href="withdrawal-request.html" class="btn-primary">Yêu cầu rút tiền</a>
      </header>

      <section class="grid-3 mb-8">
        <div class="kpi kpi-success"><div class="kpi-body"><span class="kpi-label">Tổng thu nhập</span><span class="kpi-value num-money" id="kpi-total">—</span></div></div>
        <div class="kpi kpi-primary"><div class="kpi-body"><span class="kpi-label">Số dư ví</span><span class="kpi-value num-money" id="kpi-balance">—</span></div></div>
        <div class="kpi kpi-warning"><div class="kpi-body"><span class="kpi-label">Số giao dịch</span><span class="kpi-value" id="kpi-count">—</span></div></div>
      </section>

      <section class="card">
        <div class="card-header">
          <h2 class="card-title">Giao dịch ví</h2>
          <a href="withdrawal-history.html" class="link-primary">Xem lịch sử rút tiền</a>
        </div>
        <div class="table-wrapper" style="border:none; border-radius:0; box-shadow:none;">
          <table class="table table-hover">
            <thead>
              <tr><th>Mã đơn</th><th>Loại giao dịch</th><th>Ngày</th><th class="text-right">Số tiền</th></tr>
            </thead>
            <tbody id="earnings-tbody">
              <tr><td colspan="4" class="state-cell">Đang tải...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</div>

<script type="module">
  import { isLoggedIn, getCurrentUser, logout } from '../../js/auth.js';
  import { getAuthenticated } from '../../js/api.js';

  const $ = (id) => document.getElementById(id);
  const vnd = (v) => (v === null || v === undefined ? '0' : Number(v).toLocaleString('vi-VN')) + ' đ';
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtDate = (iso) => !iso ? '—' : new Date(iso).toLocaleDateString('vi-VN', { day:'2-digit', month:'2-digit', year:'numeric', timeZone:'Asia/Ho_Chi_Minh' });
  const stateRow = (msg) => `<tr><td colspan="4" class="state-cell">${esc(msg)}</td></tr>`;

  document.addEventListener('DOMContentLoaded', () => {
    if (!isLoggedIn()) { window.location.href = '../login.html'; return; }
    const user = getCurrentUser();
    if (user?.role !== 'DRIVER') { logout('../login.html'); return; }
    $('header-user-name').textContent = user.fullName || 'Tài xế';
    $('header-user-avatar').textContent = (user.fullName || 'TX').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
    $('logout-btn')?.addEventListener('click', () => logout('../login.html'));
    load();
  });

  async function load() {
    // Ví: tổng thu nhập + số dư
    try {
      const w = await getAuthenticated('/api/driver/wallet');
      $('kpi-total').textContent = vnd(w?.totalEarned);
      $('kpi-balance').textContent = vnd(w?.balance);
    } catch (e) {
      $('kpi-total').textContent = '0 đ';
      $('kpi-balance').textContent = '0 đ';
    }

    // Danh sách giao dịch thu nhập thật
    const tbody = $('earnings-tbody');
    try {
      const data = await getAuthenticated('/api/driver/earnings?page=0&size=50');
      const items = (data && data.content) || [];
      $('kpi-count').textContent = data?.totalElements ?? items.length;
      if (!items.length) {
        tbody.innerHTML = stateRow('Chưa có giao dịch nào. Hoàn thành đơn để bắt đầu nhận tiền.');
        return;
      }
      tbody.innerHTML = items.map(t => {
        // Số âm (khấu trừ bồi thường) tô đỏ, số dương (thu nhập/nộp) tô xanh
        const amt = Number(t.amount || 0);
        const color = amt < 0 ? 'var(--color-danger)' : 'var(--color-success-text, #157347)';
        const sign = amt > 0 ? '+' : '';
        return `
        <tr>
          <td>${esc(t.orderCode || '—')}</td>
          <td>${esc(t.description || 'Giao dịch ví')}</td>
          <td>${fmtDate(t.createdAt)}</td>
          <td class="text-right num-money" style="color:${color};font-weight:600;">${sign}${vnd(t.amount)}</td>
        </tr>`;
      }).join('');
    } catch (e) {
      console.error(e);
      $('kpi-count').textContent = '0';
      tbody.innerHTML = stateRow('Không tải được giao dịch thu nhập. Vui lòng thử lại.');
    }
  }
</script>
<!-- JS Common + Bell Dropdown -->
<script type="module" src="../../js/driver-common.js"></script>
<script src="../../js/chat-badge.js"></script>
</body>
</html>
