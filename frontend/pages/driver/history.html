<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch sử nhận đơn — Move_home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .driver-nav { display: flex; align-items: center; gap: var(--spacing-lg); flex-wrap: wrap; }
    .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .filter-pill { padding: 8px 18px; border-radius: 999px; border: 1.5px solid var(--color-surface-pressed); background: var(--color-canvas); color: var(--color-body); cursor: pointer; font-weight: 500; }
    .filter-pill.active { background: var(--color-primary); color: var(--color-on-primary); border-color: var(--color-primary); }
    .pagination-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; flex-wrap: wrap; gap: 12px; }
    .pagination-controls { display: flex; gap: 6px; flex-wrap: wrap; }
    .pagination-btn-page { min-width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--color-surface-pressed); background: var(--color-canvas); cursor: pointer; }
    .pagination-btn-page.active { background: var(--color-primary); color: var(--color-on-primary); border-color: var(--color-primary); font-weight: 700; }
    .state-cell { text-align: center; padding: 40px 16px; color: var(--color-body); }
    @media (max-width: 900px) { .driver-nav { order: 3; width: 100%; justify-content: center; } }
  </style>
</head>
<body>
<div class="site-layout">
  <header class="site-header">
    <div class="container site-header-inner">
      <a href="../../index.html" class="site-logo"><span class="site-logo-text">Move_home</span></a>
      <nav class="driver-nav" aria-label="Điều hướng tài xế">
        <a href="home.html" class="nav-link">Trang chủ</a>
        <a href="available-orders.html" class="nav-link">Đơn có sẵn</a>
        <a href="in-progress.html" class="nav-link">Đang giao</a>
        <a href="history.html" class="nav-link active">Lịch sử</a>
        <a href="profile.html" class="nav-link">Hồ sơ</a>
        <a href="earnings.html" class="nav-link">Thu nhập</a>
        <a href="withdrawal-request.html" class="nav-link">Rút tiền</a>
      </nav>
      <div class="site-header-actions">
        <span class="user-menu-name">Xin chào, <span id="header-user-name">Tài xế</span></span>
        <div class="avatar avatar-sm avatar-initials" id="header-user-avatar">TX</div>
        <button id="logout-btn" class="btn-subtle">Đăng xuất</button>
      </div>
    </div>
  </header>

  <main class="site-main">
    <div class="dashboard-main">
      <header class="page-header flex-between">
        <div>
          <h1 class="page-title">Lịch sử nhận đơn</h1>
          <p class="page-subtitle">Các đơn bạn đã nhận, hoàn thành hoặc đã hủy.</p>
        </div>
        <a href="available-orders.html" class="btn-primary">Xem đơn có sẵn</a>
      </header>

      <nav class="filter-bar" id="filter-bar" aria-label="Bộ lọc lịch sử">
        <button class="filter-pill active" data-status="ALL">Tất cả</button>
        <button class="filter-pill" data-status="COMPLETED">Hoàn thành</button>
        <button class="filter-pill" data-status="CANCELLED">Đã hủy</button>
      </nav>

      <div class="table-wrapper">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>Mã đơn</th>
              <th>Ngày</th>
              <th>Tuyến đường</th>
              <th>Trạng thái</th>
              <th class="text-right">Thu nhập</th>
            </tr>
          </thead>
          <tbody id="history-tbody">
            <tr><td colspan="5" class="state-cell">Đang tải...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="pagination-bar">
        <span class="pagination-info" id="pagination-info">—</span>
        <div class="pagination-controls" id="pagination-controls"></div>
      </div>
    </div>
  </main>
</div>

<script type="module">
  import { isLoggedIn, getCurrentUser, logout } from '../../js/auth.js';
  import { getAuthenticated } from '../../js/api.js';

  const DISTRICT_VN = {
    BA_DINH:'Ba Đình', HOAN_KIEM:'Hoàn Kiếm', HAI_BA_TRUNG:'Hai Bà Trưng', DONG_DA:'Đống Đa',
    TAY_HO:'Tây Hồ', CAU_GIAY:'Cầu Giấy', THANH_XUAN:'Thanh Xuân', LONG_BIEN:'Long Biên',
    HA_DONG:'Hà Đông', HOANG_MAI:'Hoàng Mai', BAC_TU_LIEM:'Bắc Từ Liêm', NAM_TU_LIEM:'Nam Từ Liêm'
  };
  const STATUS_VN = {
    PENDING:{t:'Chờ thanh toán',c:'badge-pending'}, PENDING_PAYMENT:{t:'Chờ thanh toán',c:'badge-pending'},
    CONFIRMED:{t:'Đã xác nhận',c:'badge-active'}, ACCEPTED:{t:'Đã nhận',c:'badge-in-progress'},
    IN_PROGRESS:{t:'Đang giao',c:'badge-in-progress'}, AWAITING_FINAL_PAYMENT:{t:'Chờ thanh toán 70%',c:'badge-warning'},
    COMPLETED:{t:'Hoàn thành',c:'badge-completed'}, CANCELLED:{t:'Đã hủy',c:'badge-cancelled'},
    IN_DISPUTE:{t:'Khiếu nại',c:'badge-cancelled'}, DISPUTED:{t:'Khiếu nại',c:'badge-cancelled'}
  };

  const PAGE_SIZE = 10;
  let currentStatus = 'ALL';
  let currentPage = 0;

  const $ = (id) => document.getElementById(id);
  const district = (d) => DISTRICT_VN[d] || d || '—';
  const vnd = (v) => (v === null || v === undefined) ? '0 VND' : Number(v).toLocaleString('vi-VN') + ' VND';
  const fmtDate = (iso) => !iso ? '—' : new Date(iso).toLocaleDateString('vi-VN', { day:'2-digit', month:'2-digit', year:'numeric', timeZone:'Asia/Ho_Chi_Minh' });
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const stateRow = (msg) => `<tr><td colspan="5" class="state-cell">${esc(msg)}</td></tr>`;

  document.addEventListener('DOMContentLoaded', () => {
    if (!isLoggedIn()) { window.location.href = '../login.html'; return; }
    const user = getCurrentUser();
    if (user?.role !== 'DRIVER') { logout('../login.html'); return; }

    $('header-user-name').textContent = user.fullName || 'Tài xế';
    $('header-user-avatar').textContent = (user.fullName || 'TX').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
    $('logout-btn')?.addEventListener('click', () => logout('../login.html'));

    // Bộ lọc
    $('filter-bar').querySelectorAll('.filter-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        $('filter-bar').querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        currentStatus = pill.dataset.status;
        currentPage = 0;
        load();
      });
    });

    load();
  });

  async function load() {
    const tbody = $('history-tbody');
    tbody.innerHTML = stateRow('Đang tải...');
    try {
      const data = await getAuthenticated(
        `/api/driver/orders?status=${encodeURIComponent(currentStatus)}&page=${currentPage}&size=${PAGE_SIZE}`);
      render(data);
    } catch (err) {
      console.error(err);
      tbody.innerHTML = stateRow('Không thể tải lịch sử. Vui lòng thử lại.');
      $('pagination-info').textContent = '—';
      $('pagination-controls').innerHTML = '';
    }
  }

  function render(data) {
    const tbody = $('history-tbody');
    const items = (data && data.content) || [];

    if (items.length === 0) {
      tbody.innerHTML = stateRow('Không có đơn nào trong mục này.');
    } else {
      tbody.innerHTML = items.map(o => {
        const st = STATUS_VN[o.status] || { t: o.status, c: 'badge-neutral' };
        const earning = o.status === 'COMPLETED' ? Math.floor(Number(o.totalQuote || 0) * 0.7) : 0;
        return `<tr data-id="${esc(o.id)}" style="cursor:pointer;">
          <td>${esc(o.orderCode)}</td>
          <td>${fmtDate(o.createdAt)}</td>
          <td>${district(o.pickupDistrict)} → ${district(o.dropoffDistrict)}</td>
          <td><span class="${st.c}">${st.t}</span></td>
          <td class="text-right num-money">${vnd(earning)}</td>
        </tr>`;
      }).join('');

      // Bấm 1 dòng → mở chi tiết đơn
      tbody.querySelectorAll('tr[data-id]').forEach(tr => {
        tr.addEventListener('click', () => {
          window.location.href = `order-detail.html?id=${encodeURIComponent(tr.dataset.id)}&from=history`;
        });
      });
    }

    renderPagination(data);
  }

  function renderPagination(data) {
    const total = data.totalElements ?? 0;
    const totalPages = data.totalPages ?? 0;
    const number = data.number ?? 0;
    const size = data.size ?? PAGE_SIZE;

    const start = total === 0 ? 0 : number * size + 1;
    const end = Math.min(total, (number + 1) * size);
    $('pagination-info').textContent = `Hiển thị ${start}-${end} trong ${total} đơn`;

    const controls = $('pagination-controls');
    if (totalPages <= 1) { controls.innerHTML = ''; return; }

    let html = '';
    for (let i = 0; i < totalPages; i++) {
      html += `<button class="pagination-btn-page ${i === number ? 'active' : ''}" data-page="${i}">${i + 1}</button>`;
    }
    controls.innerHTML = html;
    controls.querySelectorAll('.pagination-btn-page').forEach(btn => {
      btn.addEventListener('click', () => {
        currentPage = parseInt(btn.dataset.page, 10);
        load();
      });
    });
  }
</script>
</body>
</html>
