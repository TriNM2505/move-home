<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập — Move_home</title>

  <!-- Preconnect Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Be Vietnam Pro — Vietnamese-native font với đầy đủ dấu -->
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">

  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<main class="auth-page">
  <div class="card-elevated auth-card">

    <!-- Logo -->
    <a href="../index.html" class="auth-logo">Move_home</a>
    <p class="auth-tagline">Chuyển nhà dễ dàng, an toàn</p>

    <!-- Thông báo lỗi chính -->
    <div id="errorMessage" class="error-alert" style="display:none" role="alert"></div>

    <!-- Form đăng nhập -->
    <form id="loginForm" novalidate>

      <!-- Email -->
      <div class="form-group">
        <label class="form-label" for="email">
          Email <span class="form-required" aria-hidden="true">*</span>
        </label>
        <input
          class="text-input"
          type="email"
          id="email"
          name="email"
          placeholder="Nhập email của bạn"
          autocomplete="email"
          required
          autofocus
        />
        <span class="form-error" id="email-error" role="alert" style="display:none"></span>
      </div>

      <!-- Mật khẩu -->
      <div class="form-group">
        <div class="form-label-row">
          <label class="form-label" for="password">
            Mật khẩu <span class="form-required" aria-hidden="true">*</span>
          </label>
          <a href="#" class="link-primary forgot-link">Quên mật khẩu?</a>
        </div>
        <div class="input-wrapper">
          <input
            class="text-input"
            type="password"
            id="password"
            name="password"
            placeholder="Nhập mật khẩu"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            class="input-toggle-btn"
            id="pwd-toggle"
            aria-label="Hiện hoặc ẩn mật khẩu"
          >👁</button>
        </div>
        <span class="form-error" id="password-error" role="alert" style="display:none"></span>
      </div>

      <!-- Nút đăng nhập -->
      <div class="form-group">
        <button type="submit" class="btn-primary btn-full" id="loginBtn">
          Đăng nhập
        </button>
      </div>

    </form>

    <div class="auth-divider">hoặc</div>

    <p class="auth-footer-text">
      Chưa có tài khoản?
      <a href="register.html" class="link-primary">Đăng ký ngay</a>
    </p>

  </div>
</main>

<!-- auth.js phụ thuộc api.js — cả hai load qua ES module import bên dưới -->
<script type="module">
  import { login, isLoggedIn, getCurrentUser, redirectAfterLogin } from '../js/auth.js';

  // Nếu đã đăng nhập thì redirect ngay theo role
  if (isLoggedIn()) {
    redirectAfterLogin(getCurrentUser());
  }

  // Hiện/ẩn mật khẩu
  document.getElementById('pwd-toggle').addEventListener('click', function () {
    const input = document.getElementById('password');
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    this.textContent = isHidden ? '🙈' : '👁';
    this.setAttribute('aria-label', isHidden ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
  });

  // Submit form đăng nhập
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErrors();

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    // Kiểm tra cơ bản phía client
    let hasError = false;
    if (!email) {
      showFieldError('email-error', 'Vui lòng nhập email.');
      hasError = true;
    }
    if (!password) {
      showFieldError('password-error', 'Vui lòng nhập mật khẩu.');
      hasError = true;
    }
    if (hasError) return;

    const btn = document.getElementById('loginBtn');
    setLoading(btn, true, 'Đang đăng nhập...');

    try {
      const data = await login(email, password);
      // Redirect theo role: ADMIN / MANAGER / DRIVER / CUSTOMER
      redirectAfterLogin(data.user);
    } catch (err) {
      handleLoginError(err);
    } finally {
      setLoading(btn, false, 'Đăng nhập');
    }
  });

  // Xử lý lỗi trả về từ backend
  function handleLoginError(err) {
    if (err.isNetworkError) {
      showErrorMessage('Lỗi kết nối. Vui lòng kiểm tra mạng và thử lại.');
    } else if (err.status === 401 || err.status === 400) {
      showErrorMessage('Sai email hoặc mật khẩu. Vui lòng kiểm tra lại.');
    } else if (err.status === 423) {
      showErrorMessage('Tài khoản bị khóa do nhập sai mật khẩu nhiều lần. Vui lòng thử lại sau 15 phút.');
    } else if (err.status === 403) {
      showErrorMessage('Vui lòng xác thực email trước khi đăng nhập.');
    } else {
      showErrorMessage(err.message || 'Đăng nhập thất bại. Vui lòng thử lại.');
    }
  }

  function showErrorMessage(msg) {
    const el = document.getElementById('errorMessage');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function showFieldError(id, msg) {
    const el = document.getElementById(id);
    if (el) { el.textContent = msg; el.style.display = 'block'; }
  }

  function clearErrors() {
    const errMsg = document.getElementById('errorMessage');
    if (errMsg) errMsg.style.display = 'none';
    ['email-error', 'password-error'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    });
  }

  function setLoading(btn, loading, label) {
    btn.disabled = loading;
    btn.classList.toggle('btn-loading', loading);
    if (loading) {
      btn.innerHTML = `<span class="btn-spinner"></span> ${label}`;
    } else {
      btn.textContent = label;
    }
  }
</script>

</body>
</html>
