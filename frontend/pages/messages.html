<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tin nhắn — Move_home</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">

  <link rel="stylesheet" href="../css/styles.css">

  <!-- SockJS + STOMP cho realtime (giong cach dung Chart.js CDN cua du an) -->
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

  <style>
    .chat-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--spacing-md);
      padding: var(--spacing-md) var(--spacing-xl);
      border-bottom: 1px solid var(--color-surface-pressed);
      background: var(--color-canvas);
    }
    .chat-topbar-actions { display: flex; align-items: center; gap: var(--spacing-md); }

    .chat-app {
      display: grid;
      grid-template-columns: 340px 1fr;
      height: calc(100vh - 66px);
      max-width: 1280px;
      margin: 0 auto;
      background: var(--color-canvas);
    }

    /* ===== Danh sach hoi thoai ===== */
    .chat-list-pane {
      border-right: 1px solid var(--color-surface-pressed);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .chat-list-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--spacing-lg); border-bottom: 1px solid var(--color-surface-pressed);
    }
    .chat-list-header h1 { font-size: 18px; font-weight: 700; margin: 0; color: var(--color-ink); }
    .chat-conv-list { overflow-y: auto; flex: 1; min-height: 0; }
    .chat-conv-item {
      display: flex; gap: var(--spacing-md); align-items: center;
      padding: var(--spacing-md) var(--spacing-lg);
      border-bottom: 1px solid var(--color-surface-pressed);
      cursor: pointer; transition: background-color 150ms;
    }
    .chat-conv-item:hover { background: var(--color-canvas-soft); }
    .chat-conv-item.active { background: var(--color-primary-soft, #E7F0EC); }
    .chat-avatar {
      width: 44px; height: 44px; border-radius: 999px; flex-shrink: 0;
      background: var(--color-primary); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 15px;
    }
    .chat-conv-main { flex: 1; min-width: 0; }
    .chat-conv-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .chat-conv-name { font-weight: 600; color: var(--color-ink); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-conv-time { font-size: 11px; color: var(--color-mute); flex-shrink: 0; }
    .chat-conv-preview { font-size: 13px; color: var(--color-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-conv-tag { font-size: 11px; color: var(--color-mute); }
    .chat-unread-pill {
      background: var(--color-danger); color: #fff; font-size: 11px; font-weight: 700;
      min-width: 18px; height: 18px; border-radius: 999px; padding: 0 5px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }

    /* ===== Khung tin nhan ===== */
    .chat-thread-pane { display: flex; flex-direction: column; min-height: 0; }
    .chat-thread-header {
      padding: var(--spacing-md) var(--spacing-xl);
      border-bottom: 1px solid var(--color-surface-pressed);
      display: flex; align-items: center; gap: var(--spacing-md);
      min-height: 60px;
    }
    .chat-thread-title { font-weight: 700; color: var(--color-ink); font-size: 15px; }
    .chat-thread-sub { font-size: 12px; color: var(--color-mute); }
    .chat-messages {
      flex: 1; overflow-y: auto; min-height: 0;
      padding: var(--spacing-xl);
      display: flex; flex-direction: column; gap: var(--spacing-sm);
      background: var(--color-canvas-soft);
    }
    .chat-bubble-row { display: flex; }
    .chat-bubble-row.mine { justify-content: flex-end; }
    .chat-bubble {
      max-width: 70%; padding: 10px 14px; border-radius: 16px;
      font-size: 14px; line-height: 1.45; word-wrap: break-word; white-space: pre-wrap;
      background: var(--color-canvas); color: var(--color-ink);
      border: 1px solid var(--color-surface-pressed);
    }
    .chat-bubble-row.mine .chat-bubble {
      background: var(--color-primary); color: #fff; border-color: var(--color-primary);
    }
    .chat-bubble-meta { font-size: 11px; color: var(--color-mute); margin-top: 3px; }
    .chat-bubble-row.mine .chat-bubble-meta { text-align: right; }
    .chat-bubble-sender { font-size: 11px; font-weight: 600; color: var(--color-body); margin-bottom: 2px; }

    .chat-composer {
      display: flex; gap: var(--spacing-sm); padding: var(--spacing-md) var(--spacing-lg);
      border-top: 1px solid var(--color-surface-pressed); background: var(--color-canvas);
    }
    .chat-composer input {
      flex: 1; border: 1px solid var(--color-surface-pressed); border-radius: 999px;
      padding: 10px 16px; font-size: 14px; font-family: inherit; outline: none;
    }
    .chat-composer input:focus { border-color: var(--color-primary); }

    .chat-placeholder, .chat-state {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: var(--spacing-sm); color: var(--color-mute); text-align: center; padding: var(--spacing-2xl);
    }
    .chat-state-icon { font-size: 44px; }
    .hidden { display: none !important; }

    @media (max-width: 800px) {
      .chat-app { grid-template-columns: 1fr; }
      .chat-thread-pane { display: none; }
      .chat-app.thread-open .chat-list-pane { display: none; }
      .chat-app.thread-open .chat-thread-pane { display: flex; }
    }

    /* ===== Modal chon tai xe (Manager) ===== */
    .chat-picker-overlay {
      position: fixed; inset: 0; background: rgba(6,27,49,0.45);
      display: flex; align-items: center; justify-content: center; z-index: 2000;
    }
    .chat-picker {
      background: var(--color-canvas); border-radius: var(--rounded-xl);
      width: 420px; max-width: 92vw; max-height: 80vh; display: flex; flex-direction: column;
      box-shadow: var(--shadow-level-2, 0 10px 30px rgba(0,0,0,0.2)); overflow: hidden;
    }
    .chat-picker-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--spacing-md) var(--spacing-lg); border-bottom: 1px solid var(--color-surface-pressed);
    }
    .chat-picker-search {
      margin: var(--spacing-md) var(--spacing-lg); padding: 8px 14px;
      border: 1px solid var(--color-surface-pressed); border-radius: 999px; font-family: inherit; font-size: 14px; outline: none;
    }
    .chat-picker-search:focus { border-color: var(--color-primary); }
    .chat-picker-list { overflow-y: auto; flex: 1; padding-bottom: var(--spacing-sm); }
    .chat-picker-item {
      display: flex; gap: var(--spacing-md); align-items: center;
      padding: 10px var(--spacing-lg); cursor: pointer;
    }
    .chat-picker-item:hover { background: var(--color-canvas-soft); }
    .chat-picker-item .chat-avatar { width: 38px; height: 38px; font-size: 13px; }
    .chat-picker-name { font-weight: 600; font-size: 14px; color: var(--color-ink); }
    .chat-picker-phone { font-size: 12px; color: var(--color-mute); }
  </style>
</head>
<body>

<div class="chat-topbar">
  <a href="../index.html" class="site-logo"><span class="site-logo-text">Move_home</span></a>
  <div class="chat-topbar-actions">
    <a id="backHomeLink" href="#" class="btn-subtle">← Về trang chủ</a>
    <button id="logoutBtn" class="btn-subtle">Đăng xuất</button>
  </div>
</div>

<div class="chat-app" id="chatApp">
  <!-- DANH SACH HOI THOAI -->
  <aside class="chat-list-pane">
    <div class="chat-list-header">
      <h1>Tin nhắn</h1>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button id="btnSupport" class="btn-secondary hidden" style="padding:6px 12px;font-size:13px;">Hỗ trợ</button>
        <button id="btnDriverSupport" class="btn-secondary hidden" style="padding:6px 12px;font-size:13px;">Nhắn quản lý</button>
        <button id="btnCompose" class="btn-secondary hidden" style="padding:6px 12px;font-size:13px;">＋ Tài xế</button>
      </div>
    </div>
    <div class="chat-conv-list" id="convList">
      <div class="chat-state"><div class="chat-state-icon">💬</div><p>Đang tải…</p></div>
    </div>
  </aside>

  <!-- KHUNG TIN NHAN -->
  <section class="chat-thread-pane">
    <div class="chat-thread-header" id="threadHeader">
      <button id="btnBackList" class="btn-subtle hidden" style="padding:4px 8px;">←</button>
      <div>
        <div class="chat-thread-title" id="threadTitle">Chọn một hội thoại</div>
        <div class="chat-thread-sub" id="threadSub"></div>
      </div>
    </div>
    <div class="chat-messages hidden" id="threadMessages"></div>
    <div class="chat-placeholder" id="threadPlaceholder">
      <div class="chat-state-icon">✉️</div>
      <p>Chọn một hội thoại ở bên trái để bắt đầu trò chuyện.</p>
    </div>
    <form class="chat-composer hidden" id="composer" autocomplete="off">
      <input type="file" id="composerImage" accept="image/jpeg,image/png,image/webp" style="display:none;">
      <button type="button" id="composerImageBtn" class="btn-subtle" title="Gửi ảnh" aria-label="Gửi ảnh" style="padding:8px 12px;font-size:18px;line-height:1;">🖼</button>
      <input type="text" id="composerInput" placeholder="Nhập tin nhắn…" maxlength="2000" aria-label="Nội dung tin nhắn">
      <button type="submit" class="btn-primary" style="padding:10px 20px;">Gửi</button>
    </form>
  </section>
</div>

<!-- Modal chon tai xe (chi Manager/Admin) -->
<div id="driverPicker" class="chat-picker-overlay hidden">
  <div class="chat-picker">
    <div class="chat-picker-header">
      <strong>Chọn tài xế để nhắn tin</strong>
      <button id="pickerClose" class="btn-subtle" style="padding:2px 10px;">✕</button>
    </div>
    <input id="pickerSearch" type="text" class="chat-picker-search" placeholder="Tìm theo tên…" autocomplete="off">
    <div id="pickerList" class="chat-picker-list"></div>
  </div>
</div>

<script type="module" src="../js/chat.js"></script>
</body>
</html>
