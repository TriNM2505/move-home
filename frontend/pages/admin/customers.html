<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khách hàng — Move_home Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">

  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>

<div class="toast-container" id="toast-container" aria-live="polite"></div>

<div class="site-layout">

  <!-- HEADER -->
  <header class="site-header">
    <div class="container site-header-inner">
      <a href="../../index.html" class="site-logo">
        <span class="site-logo-text">Move_home</span>
      </a>
      <div class="site-header-actions">
        <span class="user-menu-name">Xin chào, <span id="header-user-name">Admin</span></span>
        <div class="avatar avatar-sm avatar-initials" id="header-user-avatar" style="background-color: var(--color-primary); color: #fff;">AD</div>
        <button id="logout-btn" class="btn-subtle" style="font-weight: 500;">Đăng xuất</button>
      </div>
    </div>
  </header>

  <div class="site-body">

    <!-- SIDEBAR — Khách hàng active -->
    <aside class="sidebar" aria-label="Menu quản trị">
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-item">
          <span class="sidebar-icon" style="display: inline-flex; align-items: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="12" x2="21" y2="12"></line><line x1="3" y1="9" x2="9" y2="9"></line><line x1="3" y1="15" x2="9" y2="15"></line></svg>
          </span>
          <span>Tổng quan</span>
        </a>
        <a href="orders.html" class="sidebar-item">
          <span class="sidebar-icon" style="display: inline-flex; align-items: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
          </span>
          <span>Đơn hàng</span>
        </a>
        <a href="drivers.html" class="sidebar-item">
          <span class="sidebar-icon" style="display: inline-flex; align-items: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
          </span>
          <span>Tài xế</span>
        </a>
        <a href="customers.html" class="sidebar-item sidebar-item--active">
          <span class="sidebar-icon" style="display: inline-flex; align-items: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          </span>
          <span>Khách hàng</span>
        </a>
        <a href="withdrawals.html" class="sidebar-item">
          <span class="sidebar-icon" style="display: inline-flex; align-items: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
          </span>
          <span>Rút tiền</span>
        </a>
        <a href="transactions.html" class="sidebar-item">
          <span class="sidebar-icon" style="display: inline-flex; align-items: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
          </span>
          <span>Giao dịch</span>
        </a>
        <a href="reports.html" class="sidebar-item">
          <span class="sidebar-icon" style="display: inline-flex; align-items: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
          </span>
          <span>Báo cáo</span>
        </a>
        <div class="sidebar-divider"></div>
        <a href="settings.html" class="sidebar-item">
          <span class="sidebar-icon" style="display: inline-flex; align-items: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          </span>
          <span>Cấu hình</span>
        </a>
      </nav>
    </aside>

    <!-- MAIN -->
    <main class="site-main" id="main-content">
      <div class="dashboard-main">

        <h1 class="page-title">Khách hàng</h1>

        <!-- Error banner -->
        <div id="error-banner" class="alert alert-danger mb-6" style="display:none;" role="alert"></div>

        <!-- Filter pills -->
        <div class="filter-bar" id="filterContainer">
          <button class="filter-pill active" data-status="">Tất cả</button>
          <button class="filter-pill" data-status="ACTIVE">Đang hoạt động</button>
          <button class="filter-pill" data-status="PENDING_VERIFY">Chờ xác thực</button>
          <button class="filter-pill" data-status="SUSPENDED">Bị khóa</button>
        </div>

        <!-- Đếm kết quả -->
        <div class="table-filter-right mb-md" id="customers-count"></div>

        <!-- Bảng khách hàng -->
        <div class="card">
          <div class="table-wrapper" style="border:none; border-radius:0; box-shadow:none;">
            <table class="table table-hover">
              <thead>
                <tr>
                  <th class="table-th-eyebrow">Họ tên</th>
                  <th class="table-th-eyebrow">Email</th>
                  <th class="table-th-eyebrow">SĐT</th>
                  <th class="table-th-eyebrow">Email xác thực</th>
                  <th class="table-th-eyebrow text-right">Số đơn đã đặt</th>
                  <th class="table-th-eyebrow">Ngày tham gia</th>
                  <th class="table-th-eyebrow">Trạng thái</th>
                </tr>
              </thead>
              <tbody id="customersTableBody">
                <tr>
                  <td colspan="7" class="table-empty-row">
                    <span class="spinner spinner-sm"></span>
                    Đang tải...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Phân trang -->
        <div id="paginationContainer"></div>

        <!-- Footer -->
        <footer class="text-center text-muted" style="padding-top:var(--spacing-2xl); border-top:1px solid var(--color-surface-pressed); font-size:var(--font-size-caption); margin-top:var(--spacing-3xl);">
          Move_home Admin v2.0 &mdash; Sprint Demo 2026-06-02
        </footer>

      </div>
    </main>

  </div>
</div>

<script type="module" src="../../js/admin-customers.js"></script>
</body>
</html>
