<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Move_home</title>
  <style>
    body { margin: 0; display: flex; align-items: center; justify-content: center;
           min-height: 100vh; font-family: sans-serif; background: #f6f9fc; color: #64748d; }
  </style>
</head>
<body>
  <p>Dang chuyen huong...</p>
  <script>
    // Kiem tra token trong localStorage, redirect den trang phu hop
    const token = localStorage.getItem('accessToken');
    if (token) {
      const userInfo = localStorage.getItem('userInfo');
      let role = null;
      try { role = JSON.parse(userInfo)?.role; } catch {}

      if (role === 'ADMIN' || role === 'MANAGER') {
        window.location.replace('pages/admin/dashboard.html');
      } else {
        // Customer, Driver chua co trang rieng (Round 5)
        window.location.replace('pages/login.html');
      }
    } else {
      window.location.replace('pages/login.html');
    }
  </script>
</body>
</html>
