<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Move_home</title>
  <style>
    body { margin: 0; display: flex; align-items: center; justify-content: center;
           min-height: 100vh; font-family: sans-serif; background: #f6f9fc; color: #64748d; }
  </style>
</head>
<body>
  <p>Dang chuyen huong...</p>
  <script>
    // Map role → URL (tuong doi tu thu muc goc frontend/)
    const ROLE_HOME = {
      ADMIN:    'pages/admin/dashboard.html',
      MANAGER:  'pages/manager/home.html',
      DRIVER:   'pages/driver/home.html',
      CUSTOMER: 'pages/customer/home.html',
    };

    // Kiem tra token, redirect den trang home phu hop theo role
    const token = localStorage.getItem('accessToken');
    if (token) {
      let role = null;
      try { role = JSON.parse(localStorage.getItem('userInfo'))?.role; } catch {}
      window.location.replace(ROLE_HOME[role] || 'pages/login.html');
    } else {
      window.location.replace('pages/login.html');
    }
  </script>
</body>
</html>
