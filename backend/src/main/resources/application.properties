# ============================================
# Spring Boot ? Move_home Backend
# Profile: dev (read from .env via spring-dotenv)
# ============================================

spring.application.name=move-home-backend
server.port=${SERVER_PORT:8080}

# ============================================
# Database ? Neon PostgreSQL
# ============================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ============================================
# Multipart upload (giay to tai xe — anh <= 1.5MB theo DriverDocumentService)
# De 2MB de validate 1.5MB cua app chay truoc va tra loi than thien, thay vi loi 500 tang parse.
# ============================================
spring.servlet.multipart.max-file-size=2MB
# max-request-size 8MB de blog cong dong gui duoc toi da 3 anh/bai (V42 Pha A); moi file van chan 2MB.
spring.servlet.multipart.max-request-size=8MB

# ============================================
# Flyway ? Database Migration (theo Constitution AC-12)
# ============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ============================================
# Logging
# ============================================
logging.level.root=INFO
logging.level.vn.movehome=INFO
logging.level.org.springframework.security=INFO
# De xem SQL/binding khi debug: doi 2 dong duoi ve DEBUG/TRACE
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ============================================
# JWT (read from .env)
# ============================================
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiry-minutes=${JWT_ACCESS_EXPIRY_MINUTES:15}
app.jwt.refresh-expiry-days=${JWT_REFRESH_EXPIRY_DAYS:7}

# ============================================
# VNPay (DEMO MODE)
# ============================================
app.vnpay.tmn-code=${VNPAY_TMN_CODE}
app.vnpay.hash-secret=${VNPAY_HASH_SECRET}
app.vnpay.payment-url=${VNPAY_PAYMENT_URL}
app.vnpay.return-url=${VNPAY_RETURN_URL}
app.vnpay.ipn-url=${VNPAY_IPN_URL}

# ============================================
# Cloudinary (DEMO MODE)
# ============================================
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ============================================
# SMTP (Gmail) - DEMO MODE
# ============================================
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Password reset link points to the existing frontend page.
app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:5500/frontend/pages/reset-password.html}

# Email verification link points to the existing frontend page.
# Production: dat FRONTEND_VERIFY_EMAIL_URL tro toi domain FE that (vd https://<app>/pages/verify-email-success.html)
app.frontend.verify-email-url=${FRONTEND_VERIFY_EMAIL_URL:http://localhost:5500/frontend/pages/verify-email-success.html}

# Trang ket qua VNPay: backend xu ly /api/vnpay/return xong se redirect trinh duyet ve trang nay.
# Production: dat FRONTEND_VNPAY_RETURN_URL tro toi domain FE that.
app.frontend.vnpay-return-url=${FRONTEND_VNPAY_RETURN_URL:http://localhost:5500/frontend/pages/vnpay-return.html}

# ============================================
# Escrow (giu 70% thu nhap tai xe sau khi COMPLETED)
# Mac dinh 120 phut = 2 gio (CONTEXT). De DEMO co the ha xuong vd 2 (release sau ~2 phut).
# ============================================
app.escrow.hold-minutes=${ESCROW_HOLD_MINUTES:120}

# ============================================
# Jackson - JSON serialization (theo Constitution AC-07)
# ============================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.flyway.out-of-order=true
