# ============================================
# Spring Boot ? Move_home Backend
# Profile: dev (read from .env via spring-dotenv)
# ============================================

spring.application.name=move-home-backend
server.port=${SERVER_PORT:8080}

# ============================================
# Database ? Neon PostgreSQL
# ============================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================
# Flyway ? Database Migration (theo Constitution AC-12)
# ============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ============================================
# Logging
# ============================================
logging.level.root=INFO
logging.level.vn.movehome=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================
# JWT (read from .env)
# ============================================
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiry-minutes=${JWT_ACCESS_EXPIRY_MINUTES:15}
app.jwt.refresh-expiry-days=${JWT_REFRESH_EXPIRY_DAYS:7}

# ============================================
# VNPay (DEMO MODE)
# ============================================
app.vnpay.tmn-code=${VNPAY_TMN_CODE}
app.vnpay.hash-secret=${VNPAY_HASH_SECRET}
app.vnpay.payment-url=${VNPAY_PAYMENT_URL}
app.vnpay.return-url=${VNPAY_RETURN_URL}
app.vnpay.ipn-url=${VNPAY_IPN_URL}

# ============================================
# Cloudinary (DEMO MODE)
# ============================================
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ============================================
# SMTP (Gmail) - DEMO MODE
# ============================================
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Password reset link points to the existing frontend page.
app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:5500/frontend/pages/reset-password.html}

# ============================================
# Jackson - JSON serialization (theo Constitution AC-07)
# ============================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.flyway.out-of-order=true
