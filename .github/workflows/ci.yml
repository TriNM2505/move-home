name: CI

# Validation Gate — chay 134 unit test (H2 in-memory) tren moi PR vao main (ES-05).
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Backend build & test
    runs-on: ubuntu-latest
    env:
      # Gia tri DUMMY — test dung H2 + config test rieng (src/test/resources/application.properties).
      # Cac bien nay chi de Spring context load duoc (vd Cloudinary @Value khong co default).
      # KHONG phai secret that.
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: test
      DB_URL: jdbc:h2:mem:ci
      DB_USERNAME: sa
      DB_PASSWORD: ""
      JWT_SECRET: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      VNPAY_TMN_CODE: test
      VNPAY_HASH_SECRET: test
      VNPAY_PAYMENT_URL: http://localhost/vnpay
      VNPAY_RETURN_URL: http://localhost/return
      VNPAY_IPN_URL: http://localhost/ipn
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build & Test (mvn clean test)
        working-directory: backend
        run: mvn -B clean test

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
